# Formatting, Clippy, tests, and mutation testing for the full workspace.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-lint-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-test-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run (unit + integration tests)
        run: cargo nextest run --workspace --profile ci

      - name: cargo test --doc (nextest does not run doctests)
        run: cargo test --doc --workspace

  # A full unsharded run is ~6h; GitHub-hosted jobs max out at 6h, so we shard mutants across
  # parallel jobs (each runs ~1/N of mutants). All shards must pass for the job to succeed.
  mutants:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-mutants-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-mutants-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: cargo mutants (shard ${{ matrix.shard }})
        run: >
          cargo mutants
          --workspace
          --test-workspace
          --profile mutants
          --test-tool nextest
          --cap-lints true
          --shard ${{ matrix.shard }}
          -j 3
