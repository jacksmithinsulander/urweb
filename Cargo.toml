[workspace]
members = [".", "crates/urweb-persy", "crates/urweb-ndb"]
resolver = "2"

[package]
name = "ur"
version = "0.1.0"
edition = "2021"

[profile.test]
# opt-level 1 gives meaningful optimizations with only a modest compile-time cost.
# Corpus elaboration tests recurse deeply through the Basis standard library;
# debug (opt-level 0) is 5-10x slower than opt-level 1 for this workload.
opt-level = 1

[profile.mutants]
inherits = "test"
debug = false  # Faster builds for cargo-mutants

[[bin]]
name = "ur"
path = "src/bin/ur.rs"

[[bin]]
name = "ur-compile"
path = "src/bin/ur_compile.rs"

[[bin]]
name = "ur-fmt"
path = "src/bin/ur_fmt.rs"

[[bin]]
name = "ur-new"
path = "src/bin/ur_new.rs"

[[bin]]
name = "ur-install"
path = "src/bin/ur_install.rs"

[[bin]]
name = "ur-daemon"
path = "src/bin/ur_daemon.rs"

[[bin]]
name = "ur-lsp"
path = "src/bin/ur_lsp.rs"

[[bin]]
name = "ur-debugger"
path = "src/bin/ur_debugger.rs"

[[example]]
name = "dump_output"
path = "examples/dump_output.rs"

[dev-dependencies]
anyhow = "1"
tempfile = "3"

[dependencies]
logos     = "0.14"
lalrpop-util = { version = "0.20", features = ["lexer"] }
anyhow    = "1"
toml      = "0.8"
lsp-server = "0.7"
lsp-types = "0.97"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "std",
] }

[build-dependencies]
lalrpop = "0.20"
